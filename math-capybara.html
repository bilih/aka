<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capybara Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sunny meadow. Score pills on top, the capybara's meadow on the left, the question card and number pad on the right. One bright theme by choice. */
:root{
  color-scheme:light;
  --sky:#dff4ff; --surface:#ffffff; --ink:#2b2157; --muted:#6a628f;
  --coral:#ff5c8a; --teal:#0fb5a3; --sun:#ffc93c; --grape:#7b5cff; --grass:#8fdc7a; --grass-dark:#5fbf5a;
  --ok:#0b8f6a; --ok-soft:#d6f8ea; --bad:#d6336c; --bad-soft:#ffe3ec; --line:#cfe6f5;
  --fur:#b87a4b; --fur-dark:#8c5a35; --snout:#cf9462;
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:17px;line-height:1.4;padding:16px}
h1,h2{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:32px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none}
button:focus-visible{outline:4px solid var(--grape);outline-offset:2px}
.page{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--surface);border-radius:999px;padding:6px 16px 6px 8px;display:flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums;border:3px solid var(--line)}
.pill i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--font-display);color:#fff;font-size:16px}
.pill small{font-size:13px;color:var(--muted);font-weight:700;display:block;line-height:1}
.pill b{font-family:var(--font-display);font-size:20px;line-height:1.1;display:block}
.p-points i{background:var(--coral)} .p-streak i{background:var(--grape)} .p-right i{background:var(--teal)} .p-stars i{background:var(--sun);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px;border:3px solid var(--line)}
.seg button{background:transparent;border-radius:10px;padding:7px 14px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--grape);color:#fff}
.opts .lab{font-weight:800;color:var(--muted);font-size:15px}
.opt{display:flex;align-items:center;gap:8px}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.stage{position:relative;background:#bfeaff;border-radius:24px;overflow:hidden;min-height:340px;display:flex;align-items:flex-end;justify-content:center;border:3px solid var(--line)}
.stage::before{content:"";position:absolute;right:26px;top:22px;width:64px;height:64px;border-radius:50%;background:var(--sun)}
.stage::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-70px;height:170px;border-radius:50%;background:var(--grass)}
.stage[data-mood="sad"]{background:#c9d6ea}
.stage[data-mood="sad"]::before{background:#eef2f8}
.walker{position:relative;z-index:1;width:min(58%,270px);margin-bottom:8px;will-change:transform}
.capy{width:100%;height:auto;display:block}
.legs rect{transform-box:fill-box;transform-origin:50% 0}
.walking .legs rect:nth-child(odd){animation:step .36s ease-in-out infinite alternate}
.walking .legs rect:nth-child(even){animation:step .36s ease-in-out infinite alternate-reverse}
.walking .body{animation:bob .36s ease-in-out infinite alternate}
@keyframes step{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.sound{background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:800}
.sound[aria-pressed="true"]{border-color:var(--teal);color:var(--ok)}
.bubble{position:absolute;z-index:2;left:16px;top:16px;max-width:62%;background:var(--surface);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:800;border:3px solid var(--line)}
.stage[data-mood="happy"] .bubble{border-color:var(--ok);color:var(--ok)}
.stage[data-mood="sad"] .bubble{border-color:var(--bad);color:var(--bad)}
.fur{fill:var(--fur)} .ear,.legs rect{fill:var(--fur-dark)} .snout{fill:var(--snout)} .nose{fill:#4a2c1a}
.shadow{fill:#3c7f3a;opacity:.25}
.stroke{fill:none;stroke:#3a2314;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#2a180d} .shine{fill:#fff}
.blush{fill:var(--coral);opacity:.55}
.smile{fill:#7a2038;stroke:#3a2314;stroke-width:4;stroke-linejoin:round}
.tear{fill:#4db8ff}
.orange circle{fill:#ff9d2e} .orange path{fill:var(--grass-dark)}
.face{display:none}
.stage[data-mood="idle"] .f-idle,.stage[data-mood="happy"] .f-happy,.stage[data-mood="sad"] .f-sad{display:block}
.whole,.head,.body,.ear,.tear{transform-box:fill-box}
.whole{transform-origin:50% 100%}
.body{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.head{transform-origin:15% 85%}
.ear{transform-origin:50% 100%}
.stage[data-mood="happy"] .whole{animation:hop .55s cubic-bezier(.3,.7,.4,1) 3}
.stage[data-mood="happy"] .ear{animation:wiggle .28s ease-in-out 6}
.stage[data-mood="sad"] .head{animation:droop 2.4s ease-in-out infinite}
.stage[data-mood="sad"] .tear{animation:tear 1.4s ease-in infinite}
.stage[data-mood="idle"] .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{transform:scaleY(1.03)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.06,.9)}50%{transform:translateY(-46px) scale(.96,1.05) rotate(-4deg)}85%{transform:translateY(0) scale(1.05,.93)}}
@keyframes wiggle{50%{transform:rotate(-18deg)}}
@keyframes droop{0%,100%{transform:rotate(9deg) translateY(6px)}50%{transform:rotate(12deg) translateY(9px)}}
@keyframes tear{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1;transform:translateY(2px) scale(1)}100%{transform:translateY(44px) scale(1);opacity:0}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bit{position:absolute;z-index:3;left:50%;top:55%;width:14px;height:14px;border-radius:4px;animation:burst 1.1s ease-out forwards;pointer-events:none}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.card{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--line)}
.question{font-family:var(--font-display);font-weight:700;font-size:clamp(40px,7vw,64px);text-align:center;line-height:1.05;display:flex;justify-content:center;align-items:center;gap:.25em;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.question .op{color:var(--coral)}
.answer{min-width:2.2em;padding:0 .2em;border-radius:16px;background:#fff7d6;border:4px dashed var(--sun);color:var(--grape);text-align:center}
.card[data-state="right"] .answer{background:var(--ok-soft);border:4px solid var(--ok);color:var(--ok)}
.card[data-state="wrong"] .answer{background:var(--bad-soft);border:4px solid var(--bad);color:var(--bad);text-decoration:line-through}
.feedback{min-height:52px;text-align:center;font-weight:800;border-radius:14px;padding:6px 10px;display:grid;place-items:center}
.card[data-state="right"] .feedback{color:var(--ok)}
.card[data-state="wrong"] .feedback{color:var(--bad)}
.card[data-state="ask"] .feedback{color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{background:#eef6ff;border-radius:16px;padding:12px 0;font-family:var(--font-display);font-weight:600;font-size:26px;border-bottom:4px solid #cfe0f5}
.key:hover{background:#e0eeff}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key.del{background:#fff0d1;border-bottom-color:#f3d48f;font-size:18px}
.key.go{background:var(--teal);color:#fff;border-bottom-color:#0a8d80;font-size:20px}
.key.go.next{background:var(--coral);border-bottom-color:#d93e6c}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.reset{background:var(--surface);border:3px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px}
@media (max-width:760px){
  body{padding:12px}
  h1{font-size:26px}
  .game{grid-template-columns:minmax(0,1fr)}
  .stage{min-height:230px}
  .walker{width:min(46%,210px)}
}
@media (prefers-reduced-motion: reduce){
  .body,.whole,.head,.ear,.tear,.eye,.bit,.legs rect{animation:none !important}
  .stage[data-mood="sad"] .head{transform:rotate(9deg) translateY(6px)}
  .bit{display:none}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Capybara Math</h1>
    <div class="pills" aria-label="Score">
      <div class="pill p-points"><i aria-hidden="true">P</i><span><small>Points</small><b id="sPoints">0</b></span></div>
      <div class="pill p-streak"><i aria-hidden="true">S</i><span><small>In a row</small><b id="sStreak">0</b></span></div>
      <div class="pill p-right"><i aria-hidden="true">&#10003;</i><span><small>Correct</small><b id="sRight">0 of 0</b></span></div>
      <div class="pill p-stars"><i aria-hidden="true">&#9733;</i><span><small>Stars</small><b id="sStars">0</b></span></div>
    </div>
  </header>

  <div class="opts">
    <div class="opt"><span class="lab" id="labOp">Practice</span>
      <div class="seg" id="segOp" role="group" aria-labelledby="labOp">
        <button type="button" data-v="mul">Multiply &times;</button>
        <button type="button" data-v="div">Divide &divide;</button>
        <button type="button" data-v="mix">Both</button>
      </div></div>
    <div class="opt"><span class="lab" id="labLv">Level</span>
      <div class="seg" id="segLv" role="group" aria-labelledby="labLv">
        <button type="button" data-v="0">Easy (to 5)</button>
        <button type="button" data-v="1">Medium (to 10)</button>
        <button type="button" data-v="2">Hard (to 12)</button>
      </div></div>
    <button type="button" class="sound" id="sound" aria-pressed="true">Sound on</button>
  </div>

  <main class="game">
    <section class="stage" id="stage" data-mood="idle" aria-label="Capy the capybara">
      <p class="bubble" id="bubble">Hi! I'm Capy. Let's do some math.</p>
      <div class="walker" id="walker"><div id="flip"><svg class="capy" viewBox="0 0 340 240" role="img" aria-labelledby="capyTitle">
        <title id="capyTitle">Capy the capybara</title>
        <ellipse class="shadow" cx="168" cy="224" rx="124" ry="11"/>
        <g class="whole">
          <g class="legs">
            <rect x="74" y="184" width="27" height="40" rx="11"/><rect x="114" y="190" width="27" height="34" rx="11"/>
            <rect x="186" y="190" width="27" height="34" rx="11"/><rect x="226" y="184" width="27" height="40" rx="11"/>
          </g>
          <g class="body"><ellipse class="fur" cx="160" cy="158" rx="110" ry="60"/></g>
          <g class="head">
            <ellipse class="ear" cx="218" cy="60" rx="11" ry="14"/>
            <ellipse class="ear" cx="258" cy="58" rx="11" ry="14"/>
            <rect class="fur" x="188" y="56" width="114" height="102" rx="42"/>
            <rect class="snout" x="252" y="84" width="72" height="66" rx="26"/>
            <ellipse class="nose" cx="308" cy="102" rx="9" ry="7"/>
            <g class="orange"><circle cx="234" cy="42" r="15"/><path d="M234 28 q10 -12 18 -4 q-8 8 -18 4z"/></g>
            <g class="face f-idle">
              <circle class="eye" cx="240" cy="98" r="6.5"/><circle class="shine" cx="242" cy="96" r="2"/>
              <path class="stroke" d="M278 132 q11 7 22 0"/>
            </g>
            <g class="face f-happy">
              <path class="stroke" d="M230 101 q10 -13 20 0"/>
              <circle class="blush" cx="246" cy="122" r="10"/>
              <path class="smile" d="M272 126 q16 24 32 0z"/>
            </g>
            <g class="face f-sad">
              <path class="stroke" d="M228 82 l22 9"/>
              <circle class="eye" cx="240" cy="100" r="6.5"/><circle class="shine" cx="241" cy="102" r="2"/>
              <path class="tear" d="M238 110 q-7 11 0 15 q7 -4 0 -15z"/>
              <path class="stroke" d="M278 138 q11 -10 22 0"/>
            </g>
          </g>
        </g>
      </svg></div></div>
    </section>

    <section class="card" id="card" data-state="ask" aria-label="Question">
      <div class="question" id="question" aria-live="polite"></div>
      <p class="feedback" id="feedback" aria-live="assertive"></p>
      <div class="keypad" id="keypad">
        <button type="button" class="key" data-k="7">7</button><button type="button" class="key" data-k="8">8</button><button type="button" class="key" data-k="9">9</button>
        <button type="button" class="key" data-k="4">4</button><button type="button" class="key" data-k="5">5</button><button type="button" class="key" data-k="6">6</button>
        <button type="button" class="key" data-k="1">1</button><button type="button" class="key" data-k="2">2</button><button type="button" class="key" data-k="3">3</button>
        <button type="button" class="key del" data-k="del" aria-label="Erase last digit">Erase</button><button type="button" class="key" data-k="0">0</button>
        <button type="button" class="key go" id="go" data-k="go">Check</button>
      </div>
      <div class="foot">
        <span>10 points for each correct answer. 3 in a row earns 5 bonus points.</span>
        <button type="button" class="reset" id="reset">Reset score</button>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var stage=$('stage'), card=$('card'), qEl=$('question'), fb=$('feedback'), bubble=$('bubble'), go=$('go'), resetBtn=$('reset');
var MAX=[5,10,12], MIN=[1,2,2];
var st={op:'mul', level:1, points:0, streak:0, right:0, total:0, sound:true};
var STORE='capybara-math-v1';
try{ var sv=JSON.parse(localStorage.getItem(STORE)||'null'); if(sv) for(var k in st) if(sv[k]!==undefined) st[k]=sv[k]; }catch(e){}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(st)); }catch(e){} }

var q=null, typed='', phase='ask', timer=null, lastKey='';
var CHEERS=['Yes! Great job!','You got it!','Correct! Capy is so happy!','Wow, nice work!','That’s right!','Super!'];
var COMFORT=['Oh no. Let’s try another one.','Not this time. You can do it!','Capy is sad, but we keep going.','Almost! Try the next one.'];
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rnd(lo,hi){ return lo+Math.floor(Math.random()*(hi-lo+1)); }

/* wandering */
var walker=$('walker'), flip=$('flip'), pos=0, wTimer=null;
var still=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function wander(){
  if(still || phase!=='ask') return;
  var max=Math.max(0,(stage.clientWidth-walker.offsetWidth)/2-12);
  var target=(Math.random()*2-1)*max, dist=Math.abs(target-pos);
  if(dist<40){ wTimer=setTimeout(wander,500); return; }
  var dur=dist/55;
  flip.style.transform=target<pos?'scaleX(-1)':'scaleX(1)';
  walker.style.transition='transform '+dur.toFixed(2)+'s linear';
  walker.style.transform='translateX('+target.toFixed(0)+'px)';
  walker.classList.add('walking');
  pos=target;
  wTimer=setTimeout(function(){
    walker.classList.remove('walking');
    wTimer=setTimeout(wander,700+Math.random()*1800);
  }, dur*1000);
}
function freeze(){
  clearTimeout(wTimer);
  var m=getComputedStyle(walker).transform;
  if(m && m!=='none'){ try{ pos=new DOMMatrixReadOnly(m).m41; }catch(e){} }
  walker.style.transition='none';
  walker.style.transform='translateX('+pos.toFixed(0)+'px)';
  walker.classList.remove('walking');
}
/* sounds, made with the browser's synthesizer */
var ac=null;
function audio(){
  if(!st.sound) return null;
  try{
    if(!ac){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ac=new AC(); }
    if(ac.state==='suspended') ac.resume();
    return ac;
  }catch(e){ return null; }
}
function note(a, freq, start, dur, type, vol, slideTo){
  var o=a.createOscillator(), g=a.createGain(), t=a.currentTime+start;
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.05);
}
function playHappy(){
  var a=audio(); if(!a) return;
  [[523.25,0],[659.25,0.1],[783.99,0.2],[1046.5,0.3],[783.99,0.42],[1046.5,0.52],[1318.5,0.64]].forEach(function(n,i){
    note(a,n[0],n[1],i===6?0.45:0.16,'triangle',0.22);
  });
  note(a,261.63,0,0.3,'sine',0.12); note(a,392,0.3,0.6,'sine',0.12);
}
function playSad(){
  var a=audio(); if(!a) return;
  [[440,0,0.5],[415.3,0.55,0.5],[349.23,1.1,0.5],[329.63,1.65,1.1,293.66]].forEach(function(n){
    note(a,n[0],n[1],n[2],'sine',0.2,n[3]);
    note(a,n[0]/2,n[1],n[2],'triangle',0.08,n[3]?n[3]/2:0);
  });
}
function makeQuestion(){
  var op=st.op==='mix' ? (Math.random()<0.5?'mul':'div') : st.op, a, b, key, tries=0;
  do{ a=rnd(MIN[st.level],MAX[st.level]); b=rnd(MIN[st.level],MAX[st.level]); key=op+a+'x'+b; }while(key===lastKey && tries++<10);
  lastKey=key;
  return op==='mul' ? {x:a, y:b, sign:'×', word:'times', answer:a*b}
                    : {x:a*b, y:a, sign:'÷', word:'divided by', answer:b};
}
function showQuestion(){
  qEl.innerHTML='<span></span><span class="op"></span><span></span><span>=</span><span class="answer"></span>';
  var s=qEl.children;
  s[0].textContent=q.x; s[1].textContent=q.sign; s[2].textContent=q.y; s[4].textContent=typed||'?';
  qEl.setAttribute('aria-label', q.x+' '+q.word+' '+q.y+' equals '+(typed||'what?'));
}
function showStats(){
  $('sPoints').textContent=st.points; $('sStreak').textContent=st.streak;
  $('sRight').textContent=st.right+' of '+st.total; $('sStars').textContent=Math.floor(st.points/100);
}
function setSeg(id, val){
  [].forEach.call($(id).children, function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-v')===String(val)?'true':'false'); });
}
function next(){
  clearTimeout(timer);
  q=makeQuestion(); typed=''; phase='ask';
  card.setAttribute('data-state','ask'); stage.setAttribute('data-mood','idle');
  fb.textContent='Tap the numbers, then press Check.';
  bubble.textContent='What is '+q.x+' '+q.sign+' '+q.y+'?';
  go.textContent='Check'; go.classList.remove('next');
  showQuestion();
  clearTimeout(wTimer); wTimer=setTimeout(wander,700);
}
function confetti(){
  var colors=['#ff5c8a','#0fb5a3','#ffc93c','#7b5cff','#ff9d2e'];
  for(var i=0;i<16;i++){
    var d=document.createElement('span'), ang=Math.random()*Math.PI*2, r=90+Math.random()*110;
    d.className='bit'; d.style.background=colors[i%colors.length];
    if(i%3===0) d.style.borderRadius='50%';
    d.style.setProperty('--dx',(Math.cos(ang)*r).toFixed(0)+'px');
    d.style.setProperty('--dy',(Math.sin(ang)*r-60).toFixed(0)+'px');
    d.style.setProperty('--r',(Math.random()*540-270).toFixed(0)+'deg');
    stage.appendChild(d);
    (function(el){ setTimeout(function(){ el.remove(); },1200); })(d);
  }
}
function mood(m){
  stage.setAttribute('data-mood','idle');
  void stage.offsetWidth;
  stage.setAttribute('data-mood',m);
}
function check(){
  if(typed===''){ fb.textContent='Type an answer first.'; return; }
  var fact=q.x+' '+q.sign+' '+q.y+' = '+q.answer;
  st.total++;
  freeze();
  if(+typed===q.answer){ playHappy();
    st.streak++; st.right++;
    var gain=10+(st.streak>=3?5:0), before=Math.floor(st.points/100);
    st.points+=gain;
    var star=Math.floor(st.points/100)>before;
    phase='right'; card.setAttribute('data-state','right'); mood('happy'); confetti();
    fb.textContent=fact+'.  +'+gain+' points'+(st.streak>=3?' ('+st.streak+' in a row!)':'')+(star?'  You earned a star!':'');
    bubble.textContent=star?'A new star! Hooray!':pick(CHEERS);
    go.textContent='Next'; go.classList.add('next');
    timer=setTimeout(next,2100);
  } else {
    st.streak=0; playSad();
    phase='wrong'; card.setAttribute('data-state','wrong'); mood('sad');
    fb.textContent='Not quite. '+fact+'. Press Next when you are ready.';
    bubble.textContent=pick(COMFORT);
    go.textContent='Next'; go.classList.add('next');
  }
  showStats(); save();
}
function press(k){
  if(k==='go'){ if(phase==='ask') check(); else next(); return; }
  if(phase!=='ask') return;
  if(k==='del') typed=typed.slice(0,-1);
  else if(typed.length<3) typed=(typed==='0'?'':typed)+k;
  showQuestion();
}
$('keypad').addEventListener('click', function(e){
  var b=e.target.closest('.key'); if(b) press(b.getAttribute('data-k'));
});
document.addEventListener('keydown', function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key>='0' && e.key<='9' && e.key.length===1){ press(e.key); e.preventDefault(); }
  else if(e.key==='Backspace'){ press('del'); e.preventDefault(); }
  else if(e.key==='Enter'){
    if(e.target.closest && e.target.closest('.seg, .reset, .sound')) return;
    press('go'); e.preventDefault();
  }
});
$('segOp').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  st.op=b.getAttribute('data-v'); setSeg('segOp',st.op); save(); next();
});
$('segLv').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  st.level=+b.getAttribute('data-v'); setSeg('segLv',st.level); save(); next();
});
var soundBtn=$('sound');
function showSound(){ soundBtn.setAttribute('aria-pressed', st.sound?'true':'false'); soundBtn.textContent=st.sound?'Sound on':'Sound off'; }
soundBtn.addEventListener('click', function(){ st.sound=!st.sound; showSound(); save(); if(st.sound) playHappy(); });
showSound();
var resetTimer=null;
resetBtn.addEventListener('click', function(){
  if(resetBtn.dataset.sure){
    clearTimeout(resetTimer); delete resetBtn.dataset.sure; resetBtn.textContent='Reset score';
    st.points=0; st.streak=0; st.right=0; st.total=0; showStats(); save(); next();
  } else {
    resetBtn.dataset.sure='1'; resetBtn.textContent='Tap again to reset';
    resetTimer=setTimeout(function(){ delete resetBtn.dataset.sure; resetBtn.textContent='Reset score'; },3000);
  }
});
setSeg('segOp',st.op); setSeg('segLv',st.level); showStats(); next();
bubble.textContent='Hi! I’m Capy. What is '+q.x+' '+q.sign+' '+q.y+'?';
})();
</script>
</body>
</html>
