<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Cat: Primary 4 Science Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ink:#2d2340; --cream:#fffaf3; --purple:#6741d9; --purple-soft:#e5dbff;
    --orange:#f08c00; --orange-soft:#fff4e6; --ok:#2b8a3e; --ok-soft:#d3f9d8;
    --bad:#c92a2a; --bad-soft:#ffe3e3; --blue-soft:#d0ebff; --line:#d0bfff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;
       background:radial-gradient(circle at 12% 18%,#fff 0 3px,transparent 4px) 0 0/90px 90px,
                  linear-gradient(160deg,#e5dbff 0%,#d0ebff 55%,#c3fae8 100%)}
  button{font-family:inherit;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none}
  a{color:inherit}

  .topbar{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:20;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .btn{font-weight:700;font-size:17px;border:3px solid var(--ink);border-radius:14px;padding:6px 14px;background:#fff;color:var(--ink);
       box-shadow:0 4px 0 var(--ink);text-decoration:none;display:inline-block;transition:transform .08s, box-shadow .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.primary{background:#ffd43b}
  .btn.soft{background:var(--blue-soft)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}

  header{text-align:center;padding:64px 12px 4px}
  h1{margin:0;font-size:clamp(34px,6vw,56px);font-weight:800;color:var(--purple);text-shadow:3px 3px 0 #ffd43b,5px 5px 0 rgba(0,0,0,.08)}
  .sub{margin:0;font-weight:600;color:#5f3dc4;font-size:18px}

  .wrap{max-width:1020px;margin:0 auto;padding:12px 16px 50px}

  /* chapter picker */
  .pick-title{text-align:center;font-size:24px;font-weight:800;margin:10px 0 14px}
  .chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .chap{background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:14px;text-align:left;box-shadow:0 6px 0 var(--ink);
        display:flex;gap:12px;align-items:center;transition:transform .12s}
  .chap:hover{transform:translateY(-4px) rotate(-.5deg)}
  .chap:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .chap .ic{font-size:40px;line-height:1;flex:none}
  .chap b{display:block;font-size:19px;line-height:1.15}
  .chap small{display:block;font-size:14px;color:#5c5470;font-weight:600}
  .chap.all{background:#fff3bf}
  .best{font-size:13px;color:var(--purple);font-weight:700}

  /* game layout */
  .game{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
  @media (max-width:820px){ .game{grid-template-columns:1fr} .stage{order:-1;height:250px!important} }
  .card{background:var(--cream);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:18px}
  .qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .tag{background:var(--purple-soft);color:#5f3dc4;border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px}
  .tag.type{background:var(--orange-soft);color:#a14a00}
  .progress{height:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 10px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,#9775fa,#ffd43b);transition:width .4s}
  .stats{display:flex;gap:10px;flex-wrap:wrap;font-weight:700;font-size:16px}
  .stats span{background:#fff;border:2px dashed var(--purple);border-radius:12px;padding:0 10px}
  .question{font-size:clamp(21px,3vw,26px);font-weight:700;line-height:1.3;margin:10px 0 14px}

  .tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tf button{font-size:24px;font-weight:800;padding:16px;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);color:var(--ink)}
  .tf .t{background:#d3f9d8} .tf .f{background:#ffe3e3}
  .mc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){ .mc{grid-template-columns:1fr} }
  .opt{font-size:19px;font-weight:700;text-align:left;padding:12px 14px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);
       box-shadow:0 4px 0 var(--ink);display:flex;gap:10px;align-items:center}
  .opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--purple-soft);color:#5f3dc4;font-weight:800}
  .opt:hover:not(:disabled), .tf button:hover:not(:disabled){filter:brightness(.97)}
  .opt.right, .tf button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .opt.wrong, .tf button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .opt:disabled, .tf button:disabled{cursor:default}

  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .match .col{display:flex;flex-direction:column;gap:8px}
  .match .col h4{margin:0;font-size:14px;color:#5c5470;text-align:center}
  .mi{font-size:17px;font-weight:700;padding:9px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);text-align:left;min-height:52px;
      box-shadow:0 3px 0 var(--ink);position:relative}
  .mi.sel{outline:4px solid #ffd43b;outline-offset:1px}
  .mi .badge{position:absolute;top:-10px;right:-8px;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);font-size:13px;display:grid;place-items:center;color:var(--ink)}
  .mi.ok{border-color:var(--ok);background:var(--ok-soft)}
  .mi.no{border-color:var(--bad);background:var(--bad-soft)}
  .match-help{font-size:14px;color:#5c5470;margin:8px 0 0;text-align:center}

  .feedback{margin-top:14px;border-radius:16px;padding:10px 14px;font-size:18px;font-weight:600;display:none}
  .feedback.show{display:block}
  .feedback.good{background:var(--ok-soft);border:3px solid var(--ok)}
  .feedback.bad{background:var(--bad-soft);border:3px solid var(--bad)}
  .feedback b{font-size:20px}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}

  /* cat stage */
  .stage{position:relative;height:440px;overflow:hidden;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);
         background:linear-gradient(#cfe8ff 0%,#e7f5ff 62%,#ffdeeb 62%,#fcc2d7 100%)}
  .window{position:absolute;right:18px;top:80px;width:70px;height:70px;border:5px solid #fff;border-radius:10px;background:linear-gradient(#74c0fc,#a5d8ff)}
  .window::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:5px;background:#fff;transform:translateX(-50%)}
  .window::after{content:'';position:absolute;top:50%;left:0;right:0;height:5px;background:#fff;transform:translateY(-50%)}
  .rug{position:absolute;left:50%;bottom:22px;width:220px;height:40px;transform:translateX(-50%);background:#9775fa;border-radius:50%;border:4px dashed #e5dbff}
  .bubble{position:absolute;left:12px;right:12px;top:12px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;
          font-weight:700;font-size:17px;text-align:center;z-index:5;min-height:50px;display:flex;align-items:center;justify-content:center}
  .bubble::after{content:'';position:absolute;bottom:-14px;left:50%;border:10px solid transparent;border-top-color:var(--ink)}
  .catwrap{position:absolute;width:170px;height:190px;left:calc(50% - 85px);bottom:30px;z-index:3;transition:left .8s ease-in-out}
  .cat{width:100%;height:100%;transform-origin:50% 95%}
  .fishbowl{position:absolute;left:14px;bottom:30px;font-size:30px;z-index:2}
  .eaten{position:absolute;right:10px;bottom:8px;z-index:5;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 10px;font-weight:700;font-size:15px;color:var(--ink)}
  .idle .cat{animation:breathe 2.6s ease-in-out infinite}
  .happy .cat{animation:jump .9s ease-in-out}
  .sad .cat{animation:sadbob 1.2s ease-in-out}
  .eat .cat{animation:chomp .25s ease-in-out 4}
  @keyframes breathe{50%{transform:scale(1.02,.98)}}
  @keyframes jump{0%,100%{transform:translateY(0)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-80px) rotate(-8deg)}80%{transform:translateY(0) scale(1.05,.94)}}
  @keyframes sadbob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px) scale(1,.97)}}
  @keyframes chomp{50%{transform:scale(1.05,.93)}}
  .tail{transform-origin:118px 160px;animation:swish 1.8s ease-in-out infinite}
  .happy .tail{animation:swish .35s ease-in-out infinite}
  @keyframes swish{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
  .eyes{transform-origin:85px 80px;animation:blink 4.5s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .ear{transition:transform .3s}
  .sad .ear-l{transform:rotate(-28deg)} .sad .ear-r{transform:rotate(28deg)}
  .m-happy,.m-sad,.m-open{transition:opacity .15s}
  .m-sad,.m-open,.e-happy{opacity:0}
  .sad .m-happy{opacity:0} .sad .m-sad{opacity:1}
  .happy .e-open{opacity:0} .happy .e-happy{opacity:1}
  .eat .m-happy{animation:munchA .25s steps(1) 4} .eat .m-open{animation:munchB .25s steps(1) 4}
  @keyframes munchA{0%{opacity:1}50%{opacity:0}} @keyframes munchB{0%{opacity:0}50%{opacity:1}}
  .heart{position:absolute;z-index:6;font-size:26px;pointer-events:none;animation:float 1.4s ease-out forwards}
  @keyframes float{to{transform:translateY(-120px) scale(1.4);opacity:0}}
  .flyfish{position:fixed;left:0;top:0;z-index:70;font-size:40px;pointer-events:none}

  /* results */
  .result{text-align:center}
  .result .big{font-size:60px;margin:0}
  .result h2{margin:0;font-size:36px;color:var(--purple)}
  .result p{font-size:20px;margin:6px 0}
  .result .actions{justify-content:center}
  .review{text-align:left;margin-top:14px;font-size:16px}
  .review li{margin:4px 0}

  .hidden{display:none!important}
  .shake{animation:shk .4s}
  @keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head>
<body>
<div class="topbar">
  <a class="btn soft" href="index.html">🏠 Home</a>
  <button class="btn soft" id="soundBtn" title="Sound on/off">🔊</button>
</div>

<header>
  <h1>🐱 Science Cat 🐟</h1>
  <p class="sub">Primary 4 Science quiz: pick a chapter and feed Mochi!</p>
</header>

<div class="wrap">
  <!-- chapter picker -->
  <section id="pickScreen">
    <div class="pick-title">📚 Choose a chapter</div>
    <div class="chapters" id="chapters"></div>
  </section>

  <!-- game -->
  <section id="gameScreen" class="hidden">
    <div class="game">
      <div class="card" id="quizCard">
        <div class="qhead">
          <span class="tag" id="chapTag"></span>
          <span class="tag type" id="typeTag"></span>
        </div>
        <div class="progress"><i id="bar" style="width:0%"></i></div>
        <div class="stats"><span id="qNum"></span><span>⭐ <b id="score">0</b> pts</span><span>🐟 <b id="fishCount">0</b></span></div>
        <div class="question" id="question"></div>
        <div id="answerArea"></div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn soft" id="quitBtn">📚 Chapters</button>
          <button class="btn primary hidden" id="checkMatch">Check matches ✔️</button>
          <button class="btn primary hidden" id="nextBtn">Next ➡️</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="bubble" id="bubble">Meow! I'm Mochi. Answer right and I get a fish! 🐟</div>
        <div class="window"></div>
        <div class="fishbowl" title="Fish bowl">🐠</div>
        <div class="rug"></div>
        <div class="catwrap idle" id="catWrap">
          <svg class="cat" viewBox="0 0 170 190" aria-label="Mochi the cat">
            <!-- tail -->
            <path class="tail" d="M118 160 C 160 160, 168 120, 150 96 C 142 86, 132 92, 140 102 C 152 118, 146 146, 112 150" fill="#f59f00" stroke="#2d2340" stroke-width="3"/>
            <!-- body -->
            <ellipse cx="85" cy="140" rx="45" ry="42" fill="#ffa94d" stroke="#2d2340" stroke-width="3"/>
            <ellipse cx="85" cy="148" rx="26" ry="28" fill="#fff4e6"/>
            <path d="M58 118 q6 6 0 12 M112 118 q-6 6 0 12" stroke="#e8590c" stroke-width="4" fill="none" stroke-linecap="round"/>
            <!-- paws -->
            <ellipse cx="66" cy="178" rx="14" ry="9" fill="#fff4e6" stroke="#2d2340" stroke-width="3"/>
            <ellipse cx="104" cy="178" rx="14" ry="9" fill="#fff4e6" stroke="#2d2340" stroke-width="3"/>
            <!-- ears -->
            <g class="ear ear-l" style="transform-origin:52px 50px"><path d="M40 62 L46 18 L78 44 Z" fill="#ffa94d" stroke="#2d2340" stroke-width="3" stroke-linejoin="round"/><path d="M48 52 L50 30 L66 44 Z" fill="#ffc9c9"/></g>
            <g class="ear ear-r" style="transform-origin:118px 50px"><path d="M130 62 L124 18 L92 44 Z" fill="#ffa94d" stroke="#2d2340" stroke-width="3" stroke-linejoin="round"/><path d="M122 52 L120 30 L104 44 Z" fill="#ffc9c9"/></g>
            <!-- head -->
            <ellipse cx="85" cy="78" rx="50" ry="42" fill="#ffa94d" stroke="#2d2340" stroke-width="3"/>
            <path d="M74 40 l4 12 M85 38 v13 M96 40 l-4 12" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="85" cy="96" rx="24" ry="17" fill="#fff4e6"/>
            <!-- eyes -->
            <g class="eyes">
              <g class="e-open">
                <ellipse cx="65" cy="78" rx="8" ry="10" fill="#2d2340"/><circle cx="67.5" cy="74.5" r="3" fill="#fff"/>
                <ellipse cx="105" cy="78" rx="8" ry="10" fill="#2d2340"/><circle cx="107.5" cy="74.5" r="3" fill="#fff"/>
              </g>
              <g class="e-happy" fill="none" stroke="#2d2340" stroke-width="4" stroke-linecap="round">
                <path d="M57 80 q8 -11 16 0"/><path d="M97 80 q8 -11 16 0"/>
              </g>
            </g>
            <circle cx="52" cy="94" r="7" fill="#ff8787" opacity=".5"/><circle cx="118" cy="94" r="7" fill="#ff8787" opacity=".5"/>
            <!-- nose -->
            <path d="M80 88 h10 l-5 6 z" fill="#f06595" stroke="#2d2340" stroke-width="2" stroke-linejoin="round"/>
            <!-- mouths -->
            <path class="m-happy" d="M85 94 q-5 8 -12 4 M85 94 q5 8 12 4" fill="none" stroke="#2d2340" stroke-width="3" stroke-linecap="round"/>
            <path class="m-sad" d="M75 104 q10 -8 20 0" fill="none" stroke="#2d2340" stroke-width="3" stroke-linecap="round"/>
            <ellipse class="m-open" cx="85" cy="101" rx="7" ry="6" fill="#c92a2a" stroke="#2d2340" stroke-width="2.5"/>
            <!-- whiskers -->
            <g stroke="#2d2340" stroke-width="2" stroke-linecap="round">
              <path d="M58 92 L28 86 M58 97 L28 99"/><path d="M112 92 L142 86 M112 97 L142 99"/>
            </g>
          </svg>
        </div>
        <div class="eaten" id="eaten">😋 Mochi ate 0 🐟</div>
      </div>
    </div>
  </section>

  <!-- results -->
  <section id="resultScreen" class="hidden">
    <div class="card result" id="resultCard"></div>
  </section>
</div>

<script>
(() => {
// ================= QUESTION BANK =================
// tf: true/false · mc: multiple choice (first option is correct; options are shuffled) · match: pairs [left, right]
const CHAPTERS = [
 { id:1, icon:'🌱', name:'Energy and Photosynthesis', lessons:'Energy from Food · Photosynthesis', qs:[
  {t:'tf', q:'Plants make their own food through photosynthesis.', a:true, ex:'Green plants use light energy to make food in their leaves.'},
  {t:'tf', q:'Animals can make their own food from sunlight.', a:false, ex:'Animals cannot make food. They get energy by eating plants or other animals.'},
  {t:'tf', q:'We need energy from food to move, grow and keep warm.', a:true, ex:'Food gives living things the energy they need for life processes.'},
  {t:'tf', q:'Plants need water, carbon dioxide and light to make food.', a:true, ex:'These, together with chlorophyll, are needed for photosynthesis.'},
  {t:'mc', q:'Which gas do plants take in to make food?', o:['Carbon dioxide','Oxygen','Nitrogen','Helium'], ex:'Plants take in carbon dioxide from the air through their leaves.'},
  {t:'mc', q:'Which gas is given out during photosynthesis?', o:['Oxygen','Carbon dioxide','Smoke','Water vapour only'], ex:'Plants give out oxygen, which animals and people breathe in.'},
  {t:'mc', q:'What is the green substance in leaves that traps light energy?', o:['Chlorophyll','Starch','Soil','Iodine'], ex:'Chlorophyll is the green pigment that traps light energy.'},
  {t:'mc', q:'Where does the energy in all our food first come from?', o:['The Sun','The soil','The rain','The wind'], ex:'Energy passes from the Sun to plants, and then to animals that eat them.'},
  {t:'mc', q:'Iodine solution turns blue-black when it touches…', o:['Starch','Water','Sugar-free juice','Sand'], ex:'We test leaves for starch with iodine. Blue-black means starch is present.'},
  {t:'mc', q:'Which part of a plant takes in water from the soil?', o:['Roots','Flowers','Leaves','Fruits'], ex:'Roots absorb water, which is carried up the stem to the leaves.'},
  {t:'match', q:'Match each thing to its role in photosynthesis.', pairs:[
     ['Light','Gives the energy to make food'],
     ['Water','Taken in by the roots'],
     ['Carbon dioxide','Taken in through the leaves'],
     ['Chlorophyll','Green substance that traps light']], ex:'All four are needed for a plant to make food.'}
 ]},
 { id:2, icon:'🔥', name:'Heat', lessons:'Sources of Heat · Temperature · How Heat Travels · Effects of Heat', qs:[
  {t:'mc', q:'What is the main natural source of heat for the Earth?', o:['The Sun','The Moon','Clouds','The sea'], ex:'The Sun gives out light and heat energy.'},
  {t:'mc', q:'Which instrument measures temperature?', o:['Thermometer','Ruler','Weighing scale','Measuring cylinder'], ex:'A thermometer measures how hot or cold something is.'},
  {t:'mc', q:'Temperature is usually measured in…', o:['Degrees Celsius (°C)','Kilograms (kg)','Metres (m)','Litres (L)'], ex:'We measure temperature in degrees Celsius.'},
  {t:'mc', q:'The normal body temperature of a healthy person is about…', o:['37 °C','10 °C','60 °C','100 °C'], ex:'About 37 °C. Higher than that can mean a fever.'},
  {t:'tf', q:'Heat flows from a hotter object to a colder object.', a:true, ex:'Heat always moves from hot to cold until both are the same temperature.'},
  {t:'tf', q:'Metal is a poor conductor of heat.', a:false, ex:'Metal is a good conductor. Heat travels through it quickly.'},
  {t:'mc', q:'Three spoons are put in hot water. Which one gets hot fastest?', o:['Metal spoon','Wooden spoon','Plastic spoon','They are all the same'], ex:'Metal conducts heat best, so it heats up fastest.'},
  {t:'mc', q:'Wood and plastic are good heat…', o:['Insulators','Conductors','Sources','Thermometers'], ex:'Insulators slow down the flow of heat, so pot handles are often plastic or wood.'},
  {t:'tf', q:'Most things expand when heated and contract when cooled.', a:true, ex:'Heating makes most materials get bigger; cooling makes them smaller.'},
  {t:'mc', q:'Why are small gaps left between sections of railway tracks?', o:['So the tracks can expand on hot days','To save metal','To make the train go faster','So rain can drain away'], ex:'Metal expands when hot. The gaps stop the tracks from bending.'},
  {t:'match', q:'Match how heat travels to its description.', pairs:[
     ['Conduction','Through solids, by touching'],
     ['Convection','Carried by moving liquids or gases'],
     ['Radiation','Travels without touching, like heat from the Sun']], ex:'These are the three ways heat travels.'}
 ]},
 { id:3, icon:'💡', name:'Electricity', lessons:'Electric Circuits · Open and Closed Circuits · Series and Parallel Circuits', qs:[
  {t:'mc', q:'What gives electrical energy to a simple circuit?', o:['A battery (cell)','A bulb','A wire','A switch'], ex:'The battery is the source of electrical energy.'},
  {t:'tf', q:'A bulb lights up in an open circuit.', a:false, ex:'In an open circuit there is a gap, so electricity cannot flow and the bulb stays off.'},
  {t:'tf', q:'A switch can open or close a circuit.', a:true, ex:'Switching on closes the circuit; switching off opens it.'},
  {t:'mc', q:'Which material is a good conductor of electricity?', o:['Copper','Rubber','Plastic','Wood'], ex:'Metals like copper let electricity pass through easily.'},
  {t:'mc', q:'Why are electrical wires covered with plastic?', o:['Plastic is an insulator and keeps us safe','Plastic makes electricity flow faster','Plastic makes the wire heavier','Plastic makes the wire shine'], ex:'Plastic does not conduct electricity, so it protects us from electric shocks.'},
  {t:'mc', q:'In a series circuit, if one bulb blows, the other bulbs will…', o:['Go out','Stay lit','Get brighter','Change colour'], ex:'A series circuit has only one path. If it breaks, all bulbs go out.'},
  {t:'mc', q:'In a parallel circuit, if one bulb blows, the other bulbs will…', o:['Stay lit','Go out','Explode','Blink forever'], ex:'A parallel circuit has more than one path, so other bulbs still get electricity.'},
  {t:'tf', q:'It is safe to touch switches with wet hands.', a:false, ex:'Water can conduct electricity. Always dry your hands first.'},
  {t:'mc', q:'Which is the SAFEST thing to do?', o:['Switch off and unplug before cleaning an appliance','Plug many appliances into one socket','Pull a plug out by its cord','Push a metal object into a socket'], ex:'Always switch off and unplug before cleaning.'},
  {t:'match', q:'Match each circuit part to what it does.', pairs:[
     ['Battery','Provides electrical energy'],
     ['Switch','Opens or closes the circuit'],
     ['Bulb','Changes electrical energy into light'],
     ['Wire','Connects the parts so electricity can flow']], ex:'Every part has a job in a circuit.'}
 ]},

  {t:'mc', q:'Water can be a solid, a liquid or a gas. Which is the GAS form?', o:['Water vapour','Ice','Rain','Snow'], ex:'Water vapour is water in the gas state.'},

const ROUND = 10, PTS = 10;

// ================= HELPERS =================
const $ = id => document.getElementById(id);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

const S = { chap:null, list:[], i:0, score:0, right:0, fish:store.get('sciencecat_fish',0), sound:true, answered:false, log:[] };

// ================= CHAPTER PICKER =================
function renderChapters(){
  const best = store.get('sciencecat_best',{});
  const cards = CHAPTERS.map(c=>`
    <button class="chap" data-id="${c.id}">
      <span class="ic">${c.icon}</span>
      <span><small>Chapter ${c.id}</small><b>${esc(c.name)}</b><small>${esc(c.lessons)}</small>
      ${best[c.id]!=null?`<span class="best">Best: ${best[c.id]}/${Math.min(ROUND,c.qs.length)} ⭐</span>`:''}</span>
    </button>`).join('');
  $('chapters').innerHTML = cards + `
    <button class="chap all" data-id="all">
      <span class="ic">🎲</span>
      <span><small>All chapters</small><b>Mixed Challenge</b><small>10 questions from every chapter</small>
      ${best.all!=null?`<span class="best">Best: ${best.all}/${ROUND} ⭐</span>`:''}</span>
    </button>`;
}
$('chapters').addEventListener('click',e=>{
  const b=e.target.closest('.chap'); if(!b) return;
  startRound(b.dataset.id);
});

function show(screen){
  ['pickScreen','gameScreen','resultScreen'].forEach(s=>$(s).classList.toggle('hidden', s!==screen));
  window.scrollTo({top:0,behavior:'smooth'});
}

// ================= ROUND =================
function startRound(id){
  S.chap = id;
  let pool;
  if(id==='all'){
    pool = CHAPTERS.flatMap(c=>c.qs.map(q=>({...q, ch:c})));
    // make sure each chapter appears at least once
    const firsts = CHAPTERS.map(c=>({...pick(c.qs), ch:c}));
    const rest = shuffle(pool.filter(q=>!firsts.some(f=>f.q===q.q)));
    pool = shuffle([...firsts, ...rest.slice(0, ROUND-firsts.length)]);
  } else {
    const c = CHAPTERS.find(c=>String(c.id)===String(id));
    pool = shuffle(c.qs.map(q=>({...q, ch:c}))).slice(0,ROUND);
  }
  S.list = pool; S.i=0; S.score=0; S.right=0; S.log=[];
  show('gameScreen');
  say(pick(["Let's go! I'm hungry for fish! 🐟","Meow! Ready when you are! 😺","Purr… think carefully! 🤔"]));
  renderQ();
}

function renderQ(){
  const q = S.list[S.i];
  S.answered=false;
  $('chapTag').textContent = `${q.ch.icon} Ch ${q.ch.id}: ${q.ch.name}`;
  $('typeTag').textContent = q.t==='tf' ? '✅ True or False' : q.t==='mc' ? '🔤 Multiple choice' : '🔗 Matching';
  $('qNum').textContent = `Question ${S.i+1} of ${S.list.length}`;
  $('bar').style.width = (S.i/S.list.length*100)+'%';
  $('score').textContent = S.score; $('fishCount').textContent = S.fish;
  $('question').textContent = q.q;
  $('feedback').className='feedback'; $('feedback').innerHTML='';
  $('nextBtn').classList.add('hidden'); $('checkMatch').classList.add('hidden');
  const area = $('answerArea');

  if(q.t==='tf'){
    area.innerHTML = `<div class="tf"><button class="t" data-v="1">✅ True</button><button class="f" data-v="0">❌ False</button></div>`;
    area.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const v = b.dataset.v==='1', ok = v===q.a;
      area.querySelectorAll('button').forEach(x=>{ x.disabled=true; if((x.dataset.v==='1')===q.a) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      finish(ok, b, `The answer is <b>${q.a?'True':'False'}</b>.`);
    });
  }
  else if(q.t==='mc'){
    const opts = shuffle(q.o.map((t,i)=>({t, ok:i===0})));
    area.innerHTML = `<div class="mc">${opts.map((o,i)=>`<button class="opt" data-ok="${o.ok?1:0}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
    area.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.ok==='1';
      area.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.ok==='1') x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      finish(ok, b, `The answer is <b>${esc(q.o[0])}</b>.`);
    });
  }
  else renderMatch(q, area);
}

// ---------- matching ----------
const PAIR_COLORS = ['#ffd43b','#74c0fc','#b197fc','#8ce99a','#ffa8a8'];
function renderMatch(q, area){
  const left = q.pairs.map((p,i)=>({t:p[0], i}));
  const right = shuffle(q.pairs.map((p,i)=>({t:p[1], i})));
  const M = { sel:null, links:{} }; // links: leftIndex -> rightIndex
  area.innerHTML = `
    <div class="match">
      <div class="col" id="mL"><h4>Tap one here…</h4>${left.map(l=>`<button class="mi" data-side="L" data-i="${l.i}">${esc(l.t)}</button>`).join('')}</div>
      <div class="col" id="mR"><h4>…then its match here</h4>${right.map(r=>`<button class="mi" data-side="R" data-i="${r.i}">${esc(r.t)}</button>`).join('')}</div>
    </div>
    <p class="match-help">Tap a matched item again to undo it.</p>`;
  const btn = (side,i)=>area.querySelector(`.mi[data-side="${side}"][data-i="${i}"]`);
  function paint(){
    area.querySelectorAll('.mi').forEach(b=>{ b.style.background=''; b.querySelector('.badge')?.remove(); b.classList.remove('sel'); });
    Object.keys(M.links).forEach((l,n)=>{
      const r=M.links[l], col=PAIR_COLORS[n%PAIR_COLORS.length];
      [btn('L',l),btn('R',r)].forEach(b=>{ b.style.background=col; b.insertAdjacentHTML('beforeend',`<span class="badge" style="background:${col}">${n+1}</span>`); });
    });
    if(M.sel) btn(M.sel.side,M.sel.i).classList.add('sel');
    const done = Object.keys(M.links).length===q.pairs.length;
    $('checkMatch').classList.toggle('hidden', false);
    $('checkMatch').disabled = !done;
  }
  area.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{
    if(S.answered) return;
    const side=b.dataset.side, i=+b.dataset.i;
    // unpair if already linked
    if(side==='L' && M.links[i]!=null){ delete M.links[i]; M.sel=null; paint(); return; }
    if(side==='R'){ const l=Object.keys(M.links).find(k=>M.links[k]===i); if(l!=null){ delete M.links[l]; M.sel=null; paint(); return; } }
    if(!M.sel || M.sel.side===side){ M.sel={side,i}; paint(); return; }
    const l = side==='L'? i : M.sel.i, r = side==='R'? i : M.sel.i;
    M.links[l]=r; M.sel=null; beep('tick'); paint();
  });
  $('checkMatch').onclick=()=>{
    if(S.answered) return;
    let all=true;
    Object.keys(M.links).forEach(l=>{
      const ok = +l===M.links[l];
      if(!ok) all=false;
      [btn('L',l),btn('R',M.links[l])].forEach(b=>{ b.style.background=''; b.classList.add(ok?'ok':'no'); });
    });
    area.querySelectorAll('.mi').forEach(b=>b.disabled=true);
    $('checkMatch').classList.add('hidden');
    const answer = '<ul style="margin:6px 0 0;padding-left:20px">'+q.pairs.map(p=>`<li><b>${esc(p[0])}</b> → ${esc(p[1])}</li>`).join('')+'</ul>';
    finish(all, $('checkMatch'), all? '' : 'Correct matches:'+answer);
  };
  paint();
}

// ---------- after answering ----------
const CHEER = ["Purr-fect! 😻","Meow-velous! 🎉","You're a science star! ⭐","Yummy fish, thank you! 🐟","Clever kitty-level brain! 🧠","Paws up! High five! 🐾"];
const OOPS = ["Mew… not quite. Read the tip! 💡","Oh no, my tummy rumbles… try the next one! 🙀","Almost! You'll get the next fish! 💪","Hmm, let's learn this one together 📖"];

function finish(ok, fromEl, answerHtml){
  S.answered = true;
  const q = S.list[S.i];
  S.log.push({q:q.q, ok});
  const fb = $('feedback');
  if(ok){
    S.score += PTS; S.right++;
    fb.className='feedback show good';
    fb.innerHTML = `<b>✅ Correct! +${PTS} points</b><br>${esc(q.ex)}`;
    feedCat(fromEl, ()=>{
      S.fish++; store.set('sciencecat_fish',S.fish);
      $('fishCount').textContent=S.fish; $('eaten').textContent=`😋 Mochi ate ${S.fish} 🐟`;
      say(pick(CHEER)); mood('happy'); beep('good'); hearts();
      setTimeout(()=>mood('idle'),1000);
    });
  } else {
    fb.className='feedback show bad';
    fb.innerHTML = `<b>❌ Not quite.</b> ${answerHtml}<br>💡 ${esc(q.ex)}`;
    say(pick(OOPS)); mood('sad'); beep('bad');
    $('quizCard').classList.remove('shake'); void $('quizCard').offsetWidth; $('quizCard').classList.add('shake');
    setTimeout(()=>mood('idle'),1300);
  }
  $('score').textContent = S.score;
  $('nextBtn').textContent = S.i===S.list.length-1 ? 'See results 🏁' : 'Next ➡️';
  $('nextBtn').classList.remove('hidden');
}
$('nextBtn').onclick=()=>{
  if(S.i < S.list.length-1){ S.i++; renderQ(); say(pick(["Next one! 🐾","I can smell another fish… 🐟","You can do it! 😺","Purr… thinking time 🤔"])); }
  else showResults();
};
$('quitBtn').onclick=()=>{ renderChapters(); show('pickScreen'); };

function showResults(){
  $('bar').style.width='100%';
  const n=S.list.length, r=S.right;
  const stars = r>=n ? 3 : r>=Math.ceil(n*.7) ? 2 : r>=Math.ceil(n*.4) ? 1 : 0;
  const best = store.get('sciencecat_best',{});
  if(best[S.chap]==null || r>best[S.chap]){ best[S.chap]=r; store.set('sciencecat_best',best); }
  const title = stars===3?'Purr-fect score!':stars===2?'Great job!':stars===1?'Good try!':'Keep practising!';
  const chName = S.chap==='all' ? 'Mixed Challenge' : CHAPTERS.find(c=>String(c.id)===String(S.chap)).name;
  $('resultCard').innerHTML = `
    <p class="big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
    <h2>${title}</h2>
    <p>${esc(chName)}</p>
    <p>You got <b>${r} out of ${n}</b> right and scored <b>${S.score} points</b>.</p>
    <p>Mochi ate <b>${r}</b> fish this round 🐟 ${r>0?'and is very happy! 😻':'…she is still hungry! 🙀'}</p>
    <ol class="review">${S.log.map(l=>`<li>${l.ok?'✅':'❌'} ${esc(l.q)}</li>`).join('')}</ol>
    <div class="actions">
      <button class="btn primary" id="againBtn">🔁 Play again</button>
      <button class="btn soft" id="pickBtn">📚 Choose chapter</button>
    </div>`;
  $('againBtn').onclick=()=>startRound(S.chap);
  $('pickBtn').onclick=()=>{ renderChapters(); show('pickScreen'); };
  show('resultScreen');
  if(stars>=2){ beep('party'); for(let i=0;i<3;i++) setTimeout(hearts, i*300); }
}

// ================= CAT =================
const catWrap=$('catWrap'), bubble=$('bubble');
function mood(m){ catWrap.className='catwrap '+m; }
function say(t){ bubble.textContent=t; }
function hearts(){
  const st=$('stage'), c=catWrap.getBoundingClientRect(), s=st.getBoundingClientRect();
  for(let i=0;i<6;i++){
    const h=document.createElement('span'); h.className='heart'; h.textContent=pick(['💖','💕','⭐','🐟']);
    h.style.left=(c.left-s.left+20+Math.random()*120)+'px'; h.style.top=(c.top-s.top+30+Math.random()*40)+'px';
    h.style.animationDelay=(Math.random()*.3)+'s';
    st.appendChild(h); setTimeout(()=>h.remove(),1800);
  }
}
catWrap.addEventListener('click',()=>{ say(pick(["Purrrr… 😽","Hehe, that tickles! 😹","Meow? Got a fish? 🐟"])); mood('happy'); beep('tick'); setTimeout(()=>mood('idle'),900); });
// wander a little while idle
setInterval(()=>{
  if(!catWrap.classList.contains('idle')) return;
  const w=$('stage').clientWidth; const x=Math.max(0, Math.random()*(w-170));
  catWrap.style.left = x+'px';
}, 5000);

let feeding=false;
function feedCat(fromEl, done){
  if(feeding){ done(); return; }
  feeding=true;
  say("Is that a fish for me?! 🤩");
  const from=(fromEl||$('nextBtn')).getBoundingClientRect(), to=catWrap.getBoundingClientRect();
  const sx=from.left+from.width/2-20, sy=from.top+from.height/2-24;
  const tx=to.left+to.width*0.5-20, ty=to.top+to.height*0.5-26;
  const f=document.createElement('span'); f.className='flyfish'; f.textContent='🐟';
  f.style.transform=`translate(${sx}px,${sy}px)`; document.body.appendChild(f);
  beep('tick');
  const end=()=>{
    f.remove(); mood('eat'); say("Nom nom nom! 😋"); beep('munch');
    setTimeout(()=>{ feeding=false; done(); }, 1050);
  };
  try{
    const peak=Math.min(sy,ty)-140;
    const a=f.animate([
      {transform:`translate(${sx}px,${sy}px) rotate(0deg) scale(1)`},
      {transform:`translate(${(sx+tx)/2}px,${peak}px) rotate(-200deg) scale(1.3)`, offset:.5},
      {transform:`translate(${tx}px,${ty}px) rotate(-360deg) scale(.5)`}
    ],{duration:850,easing:'ease-in-out',fill:'forwards'});
    a.onfinish=end;
  }catch(e){ setTimeout(end,300); }
}

// ================= SOUND =================
let ctx=null;
function beep(kind){
  if(!S.sound) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    const notes = kind==='good'?[659,784,988,1319] : kind==='bad'?[330,247] : kind==='party'?[523,659,784,1047,1319,1568] : kind==='munch'?[200,170,200,170] : [880];
    notes.forEach((fq,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+i*0.09;
      o.type = kind==='bad'?'sawtooth':'triangle'; o.frequency.value=fq;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.14,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.2);
    });
  }catch(e){}
}
$('soundBtn').onclick=()=>{ S.sound=!S.sound; $('soundBtn').textContent=S.sound?'🔊':'🔇'; };

// ================= START =================
$('eaten').textContent=`😋 Mochi ate ${S.fish} 🐟`;
renderChapters();
})();
</script>
